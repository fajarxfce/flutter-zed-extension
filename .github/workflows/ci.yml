name: CI

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make check
      - run: make package

  tmux:
    if: ${{ vars.RUN_TMUX_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: python3 -m unittest tests.test_tmux_runner -v
